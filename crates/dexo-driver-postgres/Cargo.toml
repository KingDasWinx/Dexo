[package]
name = "dexo-driver-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
dexo-driver-api = { path = "../dexo-driver-api" }
futures-util = "0.3"
secrecy.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.14"
rustls = "0.23"
dexo-transport = { path = "../dexo-transport" }
uuid.workspace = true
bytes = "1"

[dev-dependencies]
dexo-app = { path = "../dexo-app" }
dexo-test-support = { path = "../dexo-test-support" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
