[package]
name = "dexo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
dexo-driver-api = { path = "../dexo-driver-api" }
dexo-plugin-protocol = { path = "../dexo-plugin-protocol" }
dexo-runtime = { path = "../dexo-runtime" }
dexo-secrets = { path = "../dexo-secrets" }
dexo-sql = { path = "../dexo-sql" }
futures-util = "0.3"
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit = "0.25.13"
indexmap = { version = "2.14", features = ["serde"] }
minisign-verify = "0.2"
rustls = "0.23.43"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
uuid.workspace = true
sha2.workspace = true
csv.workspace = true
flate2 = "1.1"
tar = "0.4.46"
encoding_rs.workspace = true
tempfile.workspace = true
image.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
dexo-test-support = { path = "../dexo-test-support" }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
dexo-plugin-sdk = { path = "../dexo-plugin-sdk" }
dexo-driver-sqlite = { path = "../dexo-driver-sqlite" }
async-trait.workspace = true
tempfile.workspace = true

[[bench]]
name = "catalog_search"
harness = false

[[bench]]
name = "export"
harness = false

[[bench]]
name = "schema_diff"
harness = false
