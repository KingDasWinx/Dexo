name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: nextest
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --all-features --profile ci
      - name: Production fixtures
        if: runner.os == 'Linux'
        run: bash scripts/check-production-fixtures.sh
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        if: runner.os == 'Linux'
        with:
          tool: cargo-deny
      - name: Deny
        if: runner.os == 'Linux'
        run: cargo deny check

  mcp:
    name: mcp conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Protocol initialize ping tools list
        run: |
          cargo test -p dexo-mcp --test protocol --all-features
          cargo test -p dexo --test mcp_stdio --all-features
        env:
          RUST_LOG: debug
