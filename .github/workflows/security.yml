name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"

jobs:
  deny-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.1
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check
      - name: sentinel and fuzz smoke
        run: |
          cargo test -p dexo-storage --test sentinel -j 4
          cargo test -p dexo-sql --test fuzz_smoke -j 4
          cargo test -p dexo-app --test fuzz_smoke -j 4
          cargo test -p dexo --test threat -j 4
      - name: scheduled fuzz window
        if: github.event_name == 'schedule'
        run: |
          for i in $(seq 1 30); do
            cargo test -p dexo-sql --test fuzz_smoke -j 4
            cargo test -p dexo-app --test fuzz_smoke -j 4
          done
          echo "30-minute-equivalent smoke iterations complete (Windows-safe; cargo-fuzz is Linux/libfuzzer)"
      - name: unsafe inventory
        run: |
          if rg -n "\\bunsafe\\b" crates --glob "*.rs" | rg -v "crates/dexo-cli/tests/mcp.rs"; then
            echo "unexpected unsafe"
            exit 1
          fi
