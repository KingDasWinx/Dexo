[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kingdaswinx/Dexo"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6.0"
keyring = "4.1.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = { version = "1.1", features = ["display", "parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.2"
unicode-width = "0.2"
insta = "1.48"
ropey = "1.6.1"
sqlparser = "0.62"
proptest = "1.7"
tree-sitter = "0.26.12"
tree-sitter-sequel = "0.3.11"
sha2 = "0.10"
csv = "1.4.0"
encoding_rs = "0.8.35"
